name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Runs every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Runs whenever you update this file
  workflow_dispatch: # Allows manual run anytime from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: nshh123/github-readme-streak-stats@vercel
        with:
          options: user=nshh123&theme=dark
          path: profile/streak.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
